version: "3.9"

networks:
  smartgig-network:
    driver: bridge
    name: smartgig-network

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  mongo_data:
  elasticsearch_data:
  grafana_data:
  prometheus_data:

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: smartgig
      POSTGRES_PASSWORD: smartgig123
      POSTGRES_DB: smartgig_db
      POSTGRES_MULTIPLE_DATABASES: smartgig_db,smartgig_auth,smartgig_user,smartgig_project
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init-multiple-dbs.sh:/docker-entrypoint-initdb.d/postgres-init-multiple-dbs.sh:ro
    networks:
      - smartgig-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartgig -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass smartgig123 --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - smartgig-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a smartgig123 ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - smartgig-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smartgig
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - smartgig-network

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Waiting for Kafka...'
      cub kafka-ready -b kafka:29092 1 30

      echo 'Creating topics...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic user.registered --partitions 3 --replication-factor 1 --config retention.ms=604800000 --config cleanup.policy=delete
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic project.created --partitions 3 --replication-factor 1 --config retention.ms=604800000 --config cleanup.policy=delete
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic project.applied --partitions 3 --replication-factor 1 --config retention.ms=604800000 --config cleanup.policy=delete
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic project.status.changed --partitions 3 --replication-factor 1 --config retention.ms=604800000 --config cleanup.policy=delete
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic skill.trending --partitions 1 --replication-factor 1 --config retention.ms=2592000000 --config cleanup.policy=delete
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic notification.send --partitions 3 --replication-factor 1 --config retention.ms=86400000 --config cleanup.policy=delete

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic user.registered.DLT --partitions 1 --replication-factor 1 --config retention.ms=2592000000 --config cleanup.policy=delete
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic project.created.DLT --partitions 1 --replication-factor 1 --config retention.ms=2592000000 --config cleanup.policy=delete
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic project.applied.DLT --partitions 1 --replication-factor 1 --config retention.ms=2592000000 --config cleanup.policy=delete
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic project.status.changed.DLT --partitions 1 --replication-factor 1 --config retention.ms=2592000000 --config cleanup.policy=delete
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic notification.send.DLT --partitions 1 --replication-factor 1 --config retention.ms=2592000000 --config cleanup.policy=delete

      echo 'All topics created!'
      "
    restart: on-failure
    networks:
      - smartgig-network

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    command: ["mongod", "--bind_ip", "0.0.0.0", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: smartgig
      MONGO_INITDB_ROOT_PASSWORD: smartgig123
      MONGO_INITDB_DATABASE: smartgig_analytics
    volumes:
      - mongo_data:/data/db
    networks:
      - smartgig-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --username smartgig --password smartgig123 --authenticationDatabase admin --eval \"db.adminCommand('ping')\" >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  elasticsearch:
    image: elasticsearch:8.11.0
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - smartgig-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20

  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "9411:9411"
    networks:
      - smartgig-network

  grafana:
    image: grafana/grafana:10.3.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - smartgig-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.49.1
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - smartgig-network
