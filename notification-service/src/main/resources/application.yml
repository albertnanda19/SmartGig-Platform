server:
  port: 8085

spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: mongodb://${MONGO_USER:smartgig}:${MONGO_PASS:smartgig123}@${MONGO_HOST:localhost}:27017/${MONGO_DB:smartgig_analytics}?authSource=admin
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:smartgig123}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
    shutdown:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
        exclude: shutdown,env,configprops,heapdump,threaddump
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1000ms
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

