version: '3.8'

services:
  postgres:
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6379:6379"

  elasticsearch:
    ports:
      - "9200:9200"
      - "9300:9300"

  kafka:
    environment:
      KAFKA_LOG_RETENTION_HOURS: 1

  mongodb:
    ports:
      - "27017:27017"

  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8091:8081"
    environment:
      REDIS_HOSTS: "local:redis:6379:0:smartgig123"
    depends_on:
      - redis
    networks:
      - smartgig-network

  mongo-express:
    image: mongo-express:1.0.2-20
    ports:
      - "8092:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: smartgig
      ME_CONFIG_MONGODB_ADMINPASSWORD: smartgig123
      ME_CONFIG_MONGODB_URL: mongodb://smartgig:smartgig123@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    networks:
      - smartgig-network

