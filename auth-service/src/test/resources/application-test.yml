spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      timeout: 2000ms
  kafka:
    producer:
      retries: 0
    consumer:
      auto-offset-reset: earliest

eureka:
  client:
    enabled: false

management:
  tracing:
    enabled: false

logging:
  level:
    com.smartgig: DEBUG
    org.springframework.kafka: WARN
    org.testcontainers: WARN
