name: SmartGig CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/smartgig

jobs:
  build-common-lib:
    name: Build Common Library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build common-lib
        run: mvn -pl common-lib clean install -DskipTests -q

      - name: Upload common-lib artifact
        uses: actions/upload-artifact@v4
        with:
          name: common-lib-jar
          path: common-lib/target/*.jar
          retention-days: 1

  test-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-common-lib

    strategy:
      matrix:
        service: [auth-service, user-service, project-service]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download common-lib
        uses: actions/download-artifact@v4
        with:
          name: common-lib-jar
          path: common-lib/target/

      - name: Install common-lib to local Maven repo
        run: mvn -pl common-lib install -DskipTests -q

      - name: Run tests for ${{ matrix.service }}
        run: mvn -pl ${{ matrix.service }} verify -Djacoco.skip=false --no-transfer-progress
        env:
          TESTCONTAINERS_REUSE_ENABLE: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.service }}
          if-no-files-found: ignore
          path: |
            ${{ matrix.service }}/target/surefire-reports/
            ${{ matrix.service }}/target/site/jacoco/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ${{ matrix.service }}/target/site/jacoco/jacoco.xml
          flags: ${{ matrix.service }}

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build-common-lib
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install common-lib
        run: mvn -pl common-lib install -DskipTests -q

      - name: Build all services (compile only)
        run: mvn -pl "!eureka-server" compile -DskipTests --no-transfer-progress

  build-docker:
    name: Build Docker ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test-services
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    strategy:
      matrix:
        service: [eureka-server, api-gateway, auth-service, user-service, project-service, intelligence-service, notification-service, analytics-service]

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all JARs
        run: |
          mvn -pl common-lib install -DskipTests -q
          mvn -pl ${{ matrix.service }} package -DskipTests -q

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [test-services, build-docker]
    if: failure()
    steps:
      - name: Create failure summary
        run: |
          echo "## CI Pipeline Failed" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

